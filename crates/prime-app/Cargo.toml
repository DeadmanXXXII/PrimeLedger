[package]
name = "prime-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "primeledger"
path = "src/main.rs"

[dependencies]
prime-core.workspace = true
prime-store.workspace = true
prime-verify.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

# On Linux, winit needs an explicit windowing backend; without one the GUI
# does not build or cannot open a window. Cargo unions these with the line above.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
